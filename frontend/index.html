<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Awesome React App | Powerful Frontend Solutions</title>
    <meta name="description" content="Explore our cutting-edge React application built with Vite for lightning-fast development and unparalleled user experience. Discover modern web solutions." />
    <link rel="canonical" href="https://www.example.com/" />

    <!-- Open Graph Tags -->
    <meta property="og:title" content="My Awesome React App | Powerful Frontend Solutions" />
    <meta property="og:description" content="Explore our cutting-edge React application built with Vite for lightning-fast development and unparalleled user experience. Discover modern web solutions." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.example.com/" />
    <meta property="og:image" content="https://www.example.com/og-image.jpg" />
    <meta property="og:site_name" content="My Awesome Company" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@id": "https://www.example.com/#organization",
          "@type": "Organization",
          "name": "My Awesome Company",
          "url": "https://www.example.com/",
          "logo": "https://www.example.com/logo.png",
          "sameAs": [
            "https://twitter.com/myawesomecompany",
            "https://facebook.com/myawesomecompany",
            "https://linkedin.com/company/myawesomecompany"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.example.com/#website",
          "url": "https://www.example.com/",
          "name": "My Awesome Company Website",
          "publisher": {
            "@id": "https://www.example.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.example.com/?s={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "WebPage",
          "@id": "https://www.example.com/#webpage",
          "url": "https://www.example.com/",
          "name": "My Awesome React App | Powerful Frontend Solutions",
          "description": "Explore our cutting-edge React application built with Vite for lightning-fast development and unparalleled user experience. Discover modern web solutions.",
          "isPartOf": {
            "@id": "https://www.example.com/#website"
          },
          "primaryImageOfPage": {
            "@type": "ImageObject",
            "url": "https://www.example.com/og-image.jpg"
          },
          "publisher": {
            "@id": "https://www.example.com/#organization"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
